name: Release Ezkiel Notch for Windows

# Windows has its own tags (windows-v0.9.0) so it can ship without a Mac release. Pushing one builds the app with
# that version, self-tests it, and publishes a release with EzkielNotch-windows-win-x64.zip, -win-arm64.zip and
# SHA256SUMS-windows.txt. Versions below 1.0 are marked Preview (a GitHub prerelease), which also keeps them out of
# the Mac app's update check (it reads "latest").
on:
  push:
    tags: ["windows-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: windows/EzkielNotch.Windows
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Core tests
        run: dotnet test ../EzkielNotch.Core.Tests -c Release

      - name: Publish x64 and ARM64 with the tag's version
        run: |
          $version = $env:TAG -replace '^windows-v', ''
          foreach ($rid in "win-x64", "win-arm64") {
            dotnet publish -c Release -r $rid --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$version -o "out/$rid"
            Remove-Item "out/$rid/*.pdb" -ErrorAction SilentlyContinue
            Compress-Archive -Path "out/$rid/*" -DestinationPath "out/EzkielNotch-windows-$rid.zip" -Force
          }
          Push-Location out
          Get-ChildItem -Filter *.zip | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content -Encoding ascii SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt
          Get-ChildItem -Filter *.zip | Format-Table Name, Length
          Pop-Location

      - name: Self-test the release build
        run: |
          $snap = Join-Path $PWD "snapshots"
          $p = Start-Process -FilePath "out/win-x64/EzkielNotch.exe" -ArgumentList "--self-test","--snapshots",$snap -PassThru -RedirectStandardOutput "selftest.log"
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Error "self-test timed out"; exit 1 }
          Get-Content (Join-Path $snap "self-test-result.txt")
          exit $p.ExitCode

      - name: Publish the release
        run: |
          $version = $env:TAG -replace '^windows-v', ''
          $preview = [version]$version -lt [version]"1.0.0"
          $title = if ($preview) { "Ezkiel Notch for Windows $version (Preview)" } else { "Ezkiel Notch for Windows $version" }
          $notes = Join-Path $env:GITHUB_WORKSPACE "windows/RELEASE_NOTES.md"
          $files = "out/EzkielNotch-windows-win-x64.zip", "out/EzkielNotch-windows-win-arm64.zip", "out/SHA256SUMS-windows.txt"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
          } else {
            $flags = @("--title", $title, "--notes-file", $notes, "--target", $env:GITHUB_SHA)
            if ($preview) { $flags += "--prerelease" }
            gh release create $env:TAG @files @flags
          }
